group = "com.cashew.pennywise"
version = "1.0"

// No buildscript/AGP pin here: when consumed by a host Flutter app the Android
// Gradle Plugin + Kotlin plugin are provided by the app's build (all modules
// must use the same AGP version). The example app supplies them for standalone
// builds.
apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.cashew.pennywise"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        // Vendored PennyWise parser-core (populated by tool/sync_parser_core.sh).
        // Compiled into this AAR as-is; never duplicated in Dart.
        main.java.srcDirs += "vendor/parser-core/kotlin"
    }
}

dependencies {
    // Sole external dependency of parser-core.
    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"
    // Capture pipeline: ContextCompat (permission checks) +
    // NotificationManagerCompat (notification-listener access status).
    implementation "androidx.core:core-ktx:1.12.0"
}
